[package]
name         = "ab-nui"
description  = "a reactive UI library for Neovim"
version      = { workspace = true }
edition      = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }

# The workspace exposes this crate under the `wp_ui` alias, so consumers
# `use wp_ui::...` (see `[workspace.dependencies]` in the root Cargo.toml).

[dependencies]
# NOTE: this crate deliberately does NOT depend on nvim-oxi.
# It talks to Neovim purely through `vim.*` via mlua. The workspace pins mlua to
# the version/feature set nvim-oxi requires (mlua 0.11, `luajit`) so Cargo
# unifies them into a single crate instance and the host can hand us its live
# `Lua`.
#
# (The integration tests in ./nvim-tests do use nvim-oxi — only for its test
# harness, which runs each test inside a real Neovim.)
mlua          = { workspace = true }
thiserror     = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
# Media in code views (kitty graphics protocol): pure-Rust image decoding,
# and the terminal's cell size in pixels.
image         = { workspace = true }
libc          = { workspace = true }
